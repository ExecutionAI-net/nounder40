name: Load test (nightly)

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC every night
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Which scenario'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - login
          - booking
          - journey
          - hq

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BASE_URL: ${{ secrets.LOADTEST_BASE_URL }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      LOAD_SCHOOL_ID: ${{ secrets.LOADTEST_SCHOOL_ID }}
      LOAD_COURSE_ID: ${{ secrets.LOADTEST_COURSE_ID }}
      LOAD_STUDENT_COUNT: '20'
      LOAD_LESSON_CAPACITY: '5'
      HQ_EMAIL: ${{ secrets.LOADTEST_HQ_EMAIL }}
      HQ_PASSWORD: ${{ secrets.LOADTEST_HQ_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Prepare results dir
        run: mkdir -p tests/load/results

      - name: Seed test data
        id: seed
        run: |
          OUTPUT=$(node tests/load/seed.mjs)
          echo "$OUTPUT"
          LESSON_ID=$(echo "$OUTPUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.LOAD_LESSON_ID)})")
          echo "lesson_id=$LESSON_ID" >> "$GITHUB_OUTPUT"

      - name: Run login throughput
        if: ${{ github.event.inputs.scenario == 'login' || github.event.inputs.scenario == 'all' || github.event_name == 'schedule' }}
        run: k6 run --summary-export=tests/load/results/login.json tests/load/scenarios/login-throughput.js
        continue-on-error: true

      - name: Notify Slack — login
        if: ${{ (github.event.inputs.scenario == 'login' || github.event.inputs.scenario == 'all' || github.event_name == 'schedule') && always() }}
        run: node tests/load/reporters/slack-loadtest.mjs --summary tests/load/results/login.json --scenario "Login throughput" --status ${{ steps.login.outcome == 'success' && 'pass' || 'fail' }}

      - name: Run booking race
        env:
          LOAD_LESSON_ID: ${{ steps.seed.outputs.lesson_id }}
        if: ${{ github.event.inputs.scenario == 'booking' || github.event.inputs.scenario == 'all' || github.event_name == 'schedule' }}
        run: k6 run --summary-export=tests/load/results/booking.json tests/load/scenarios/booking-race.js
        continue-on-error: true

      - name: Notify Slack — booking
        if: ${{ (github.event.inputs.scenario == 'booking' || github.event.inputs.scenario == 'all' || github.event_name == 'schedule') && always() }}
        run: node tests/load/reporters/slack-loadtest.mjs --summary tests/load/results/booking.json --scenario "Booking race" --status pass

      - name: Run browse-and-book
        env:
          LOAD_LESSON_ID: ${{ steps.seed.outputs.lesson_id }}
        if: ${{ github.event.inputs.scenario == 'journey' || github.event.inputs.scenario == 'all' || github.event_name == 'schedule' }}
        run: k6 run --summary-export=tests/load/results/journey.json tests/load/scenarios/browse-and-book.js
        continue-on-error: true

      - name: Notify Slack — journey
        if: ${{ (github.event.inputs.scenario == 'journey' || github.event.inputs.scenario == 'all' || github.event_name == 'schedule') && always() }}
        run: node tests/load/reporters/slack-loadtest.mjs --summary tests/load/results/journey.json --scenario "Browse and book" --status pass

      - name: Run HQ dashboard
        if: ${{ github.event.inputs.scenario == 'hq' || github.event.inputs.scenario == 'all' || github.event_name == 'schedule' }}
        run: k6 run --summary-export=tests/load/results/hq.json tests/load/scenarios/dashboard-hq.js
        continue-on-error: true

      - name: Notify Slack — hq
        if: ${{ (github.event.inputs.scenario == 'hq' || github.event.inputs.scenario == 'all' || github.event_name == 'schedule') && always() }}
        run: node tests/load/reporters/slack-loadtest.mjs --summary tests/load/results/hq.json --scenario "HQ dashboard" --status pass

      - name: Teardown
        if: always()
        env:
          LOAD_LESSON_ID: ${{ steps.seed.outputs.lesson_id }}
        run: node tests/load/teardown.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summaries
          path: tests/load/results/
          retention-days: 30
