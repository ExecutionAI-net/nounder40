name: Ops - purge public media

# Pulizia incidente R3-C2: prima della correzione di `save_public()` chiunque
# poteva caricare un `.html`/`.svg` sotto /media/public/, servito come
# documento sull'origine dell'app. Il codice ora rifiuta quei file, ma quelli
# gia' scritti sul volume non li tocca nessuno: non esiste una API di prodotto
# che cancelli un media grezzo. Questo workflow gira `purge_public_media`
# sull'istanza, di default in sola lettura.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente su cui girare"
        type: choice
        options: [develop, production]
        default: develop
      apply:
        description: "Cancellare davvero i file (--apply). Lasciare falso per il solo report."
        type: boolean
        default: false

concurrency:
  group: nounder40-ec2-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purge_public_media:
    name: purge_public_media (${{ inputs.environment }}${{ inputs.apply && ' --apply' || ' report' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_DEPLOY_DIR: ${{ vars.EC2_DEPLOY_DIR }}
      COMPOSE_FILE: ${{ vars.COMPOSE_FILE }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: nounder40-purge-media-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run purge_public_media through SSM
        shell: bash
        run: |
          set -euo pipefail

          FLAG=""
          if [ "${{ inputs.apply }}" = "true" ]; then FLAG=" --apply"; fi

          REMOTE="cd '${EC2_DEPLOY_DIR}' && BACKEND_IMAGE=unused FRONTEND_IMAGE=unused docker compose -f '${COMPOSE_FILE}' --env-file .env.prod exec -T django python manage.py purge_public_media${FLAG}"

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "$(jq -nc --arg c "$REMOTE" '{commands: [$c]}')" \
            --timeout-seconds 120 \
            --comment "purge_public_media${FLAG} (${GITHUB_RUN_ID})" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          for _ in $(seq 1 24); do
            sleep 5
            OUT=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" --output json 2>/dev/null || true)
            case "$(jq -r '.Status // "Pending"' <<<"$OUT")" in
              Success)
                jq -r '.StandardOutputContent // ""' <<<"$OUT"
                exit 0 ;;
              InProgress|Pending|Delayed) ;;
              *)
                jq -r '.StandardOutputContent // ""' <<<"$OUT"
                jq -r '.StandardErrorContent // ""' <<<"$OUT" >&2
                exit 1 ;;
            esac
          done
          echo "Timeout: il comando non e' terminato entro 2 minuti" >&2
          exit 1
