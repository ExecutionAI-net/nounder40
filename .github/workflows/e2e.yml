name: E2E — Playwright

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Run all Playwright suites
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install chromium --with-deps

      - name: Write .env.local (used by `npm run dev`)
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL=https://nounder40.vercel.app
          EOF

      - name: Write .env.test (used by Playwright)
        run: |
          cat > .env.test <<EOF
          TEST_HQ_EMAIL=${{ secrets.TEST_HQ_EMAIL }}
          TEST_HQ_PASSWORD=${{ secrets.TEST_HQ_PASSWORD }}
          TEST_SCHOOL_EMAIL=${{ secrets.TEST_SCHOOL_EMAIL }}
          TEST_SCHOOL_PASSWORD=${{ secrets.TEST_SCHOOL_PASSWORD }}
          TEST_TEACHER_EMAIL=${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD=${{ secrets.TEST_TEACHER_PASSWORD }}
          TEST_STUDENT_EMAIL=${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD=${{ secrets.TEST_STUDENT_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
          EOF

      - name: Run all Playwright suites
        run: npm run test:e2e
        env:
          CI: 'true'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test-results (screenshots, traces, video)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
