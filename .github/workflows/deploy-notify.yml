name: Deploy Notify

# Deploy notifications to Slack via chat.postMessage (same bot token + channel as
# the push notifications). Requires repo secret SLACK_BOT_TOKEN and the bot
# invited to the channel below.
#
# NOTE: while the refactor is in progress the live target is still Vercel, so the
# result step waits on the Vercel commit status. When the Docker deploy pipeline
# lands (Phase 8) this wait step is swapped for the container deploy result.
on:
  push:
    # The develop branch is deployed and notified by ci.yml. Keep this legacy
    # Vercel-status workflow only for main until that environment also moves.
    branches: [main]

permissions:
  statuses: read
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack - deploy started
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          TEXT="🚀 *Deploy started*\n*Branch:* \`${{ github.ref_name }}\`\n*Commit:* <${COMMIT_URL}|\`${SHORT_SHA}\`>\n*Actor:* ${{ github.actor }}"
          jq -n --arg channel "$SLACK_CHANNEL" --arg text "$TEXT" \
            '{channel: $channel, text: $text, unfurl_links: false}' \
          | curl -sS -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" --data @-

      - name: Wait for Vercel deployment status
        id: vercel_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          for i in $(seq 1 60); do
            RESULT=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" --jq '[.statuses[] | select(.context=="Vercel")][0]')
            STATE=$(echo "$RESULT" | jq -r 'if . == null then "" else (.state // "") end')
            if [ "$STATE" = "success" ] || [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
              echo "state=$STATE" >> "$GITHUB_OUTPUT"
              echo "target_url=$(echo "$RESULT" | jq -r '.target_url // ""')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "state=timeout" >> "$GITHUB_OUTPUT"
          echo "target_url=" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - result
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          STATE="${{ steps.vercel_status.outputs.state }}"
          TARGET_URL="${{ steps.vercel_status.outputs.target_url }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATE" = "success" ]; then
            HEADER="✅ *Deploy SUCCESS*"
          elif [ "$STATE" = "timeout" ]; then
            HEADER="⏱️ *Deploy TIMED OUT* (still building after 10 min)"
          else
            HEADER="❌ *Deploy FAILED*"
          fi

          TEXT="${HEADER}\n*Branch:* \`${{ github.ref_name }}\`\n*Commit:* <${COMMIT_URL}|\`${SHORT_SHA}\`>\n*Actor:* ${{ github.actor }}"
          if [ -n "$TARGET_URL" ]; then
            TEXT="${TEXT}\n*Deployment:* <${TARGET_URL}|View deployment>"
          fi
          TEXT="${TEXT}\n<${RUN_URL}|Open workflow run>"

          jq -n --arg channel "$SLACK_CHANNEL" --arg text "$TEXT" \
            '{channel: $channel, text: $text, unfurl_links: false}' \
          | curl -sS -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" --data @-
