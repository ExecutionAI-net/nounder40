name: Deploy Notify

on:
  push:
    branches: [main, develop]

permissions:
  statuses: read
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack - deploy started
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          TEXT="🚀 *Deploy started*\n*Branch:* \`${{ github.ref_name }}\`\n*Commit:* <${COMMIT_URL}|\`${SHORT_SHA}\`>\n*Actor:* ${{ github.actor }}"
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"

      - name: Wait for Vercel deployment status
        id: vercel_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          for i in $(seq 1 60); do
            RESULT=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" --jq '[.statuses[] | select(.context=="Vercel")][0]')
            STATE=$(echo "$RESULT" | jq -r 'if . == null then "" else (.state // "") end')
            if [ "$STATE" = "success" ] || [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
              echo "state=$STATE" >> "$GITHUB_OUTPUT"
              echo "target_url=$(echo "$RESULT" | jq -r '.target_url // ""')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "state=timeout" >> "$GITHUB_OUTPUT"
          echo "target_url=" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - result
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATE="${{ steps.vercel_status.outputs.state }}"
          TARGET_URL="${{ steps.vercel_status.outputs.target_url }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATE" = "success" ]; then
            HEADER="✅ *Deploy SUCCESS*"
          elif [ "$STATE" = "timeout" ]; then
            HEADER="⏱️ *Deploy TIMED OUT* (still building after 10 min)"
          else
            HEADER="❌ *Deploy FAILED*"
          fi

          TEXT="${HEADER}\n*Branch:* \`${{ github.ref_name }}\`\n*Commit:* <${COMMIT_URL}|\`${SHORT_SHA}\`>\n*Actor:* ${{ github.actor }}"
          if [ -n "$TARGET_URL" ]; then
            TEXT="${TEXT}\n*Deployment:* <${TARGET_URL}|View on Vercel>"
          fi
          TEXT="${TEXT}\n<${RUN_URL}|Open workflow run>"

          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
