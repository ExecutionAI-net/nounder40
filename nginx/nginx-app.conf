# Internal application proxy shared by the dev and production Compose stacks.
# TLS and domain routing are owned by the host-level nginx (nginx/edge.conf).

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    sendfile on;
    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    # The loopback-only edge proxy overwrites X-Real-IP with the client IP.
    limit_req_zone $http_x_real_ip zone=auth:10m rate=10r/m;

    server {
        listen 80;
        server_name _;

        set $django django:8000;
        set $frontend frontend:3000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;

        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://$django;
        }
        location /api/ { proxy_pass http://$django; }
        location /admin/ { proxy_pass http://$django; }
        location /django-static/ {
            proxy_pass http://$django;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        location /media/public/ {
            alias /var/www/media/public/;
            expires 7d;
            add_header Cache-Control "public";
        }
        location /internal-media/ {
            internal;
            alias /var/www/media/private/;
        }
        location /ws/ {
            proxy_pass http://$django;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
        location /_next/static/ {
            proxy_pass http://$frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location / { proxy_pass http://$frontend; }
    }
}
