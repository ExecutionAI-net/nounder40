# No Under 40 — production nginx.
#
# Differences from nginx.conf (dev): TLS termination + HTTP→HTTPS redirect,
# security headers, rate limiting on the auth endpoints, longer static/media
# cache lifetimes. Routing to django/frontend is otherwise identical.
#
# Certificates are managed by Certbot on the EC2 host. docker-compose.run.yml
# mounts /etc/letsencrypt read-only and exposes /var/www/certbot for renewals.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # Auth endpoints get real brute-force exposure (login, password reset,
    # invite completion) — cap request rate per client IP. `burst` absorbs a
    # normal page's handful of near-simultaneous calls without tripping.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ---- HTTP: only redirect + Let's Encrypt's ACME challenge ----
    server {
        listen 80;
        server_name danzaclassicanounder40.com www.danzaclassicanounder40.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS ----
    server {
        listen 443 ssl;
        http2 on;
        server_name danzaclassicanounder40.com www.danzaclassicanounder40.com;

        ssl_certificate     /etc/letsencrypt/live/danzaclassicanounder40.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/danzaclassicanounder40.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS only here: it's a statement about the TLS connection itself
        # (only nginx, the actual TLS terminator, can meaningfully assert
        # it), and neither app sets one, so no conflict. Nothing else is
        # set globally on purpose — both apps already own their own
        # security headers, confirmed live (`curl -I` showed each header
        # twice, with different values on the frontend, before this was
        # trimmed down to just HSTS):
        #   - frontend/next.config.ts's headers() sets CSP, X-Frame-Options,
        #     X-Content-Type-Options, Referrer-Policy on every Next.js route.
        #   - Django's SecurityMiddleware (SECURE_CONTENT_TYPE_NOSNIFF=True)
        #     + XFrameOptionsMiddleware set X-Content-Type-Options and
        #     X-Frame-Options on every Django response, admin included.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        set $django   django:8000;
        set $frontend frontend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # ---- Django backend ----
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://$django;
        }

        location /api/ {
            proxy_pass http://$django;
        }

        location /admin/ {
            proxy_pass http://$django;
        }

        location /django-static/ {
            proxy_pass http://$django;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Public media only — same as dev, no location exists for
        # /media/private/ so a guessed path 404s instead of ever proxying.
        location /media/public/ {
            # Serviti da nginx, non da Django: la rotta Django per i media
            # pubblici esiste solo sotto DEBUG, quindi in produzione ogni foto
            # caricata rispondeva 404 pur essendo sul disco. Il volume e'
            # gia' montato qui in sola lettura; /media/private/ resta senza
            # location, raggiungibile solo via X-Accel-Redirect da una view
            # che ha gia' verificato i permessi.
            alias /var/www/media/public/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # X-Accel-Redirect target for private files — reachable ONLY via an
        # internal redirect from a Django view that already checked
        # permission, never directly by a client request.
        location /internal-media/ {
            internal;
            alias /var/www/media/private/;
        }

        # ---- Django Channels (WebSocket) ----
        location /ws/ {
            proxy_pass http://$django;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # ---- Next.js static assets: content-hashed, cache forever ----
        location /_next/static/ {
            proxy_pass http://$frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ---- Next.js frontend (default) ----
        location / {
            proxy_pass http://$frontend;
        }
    }
}
