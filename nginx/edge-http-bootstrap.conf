# Temporary host-nginx configuration used only while issuing certificates.
server {
    listen 80;
    listen [::]:80;
    server_name danzaclassicanounder40.com www.danzaclassicanounder40.com dev.danzaclassicanounder40.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "TLS bootstrap in progress\n";
        add_header Content-Type text/plain;
    }
}
