events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS: resolve upstream names at request time so nginx
    # boots even if a service is still starting.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # WebSocket upgrade (Next.js HMR in dev + Django Channels /ws in Phase 5).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    server {
        listen 80;
        server_name _;

        set $django   django:8000;
        set $frontend frontend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # ---- Django backend ----
        location /api/ {
            proxy_pass http://$django;
        }

        location /admin/ {
            proxy_pass http://$django;
        }

        location /django-static/ {
            proxy_pass http://$django;
        }

        # Public media only. There is no location for /media/private/ — Django
        # never routes it either — so a guessed path simply 404s.
        location /media/public/ {
            # Serviti da nginx, non da Django: la rotta Django per i media
            # pubblici esiste solo sotto DEBUG, quindi in produzione ogni foto
            # caricata rispondeva 404 pur essendo sul disco. Il volume e'
            # gia' montato qui in sola lettura; /media/private/ resta senza
            # location, raggiungibile solo via X-Accel-Redirect da una view
            # che ha gia' verificato i permessi.
            alias /var/www/media/public/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # X-Accel-Redirect target for private files: reachable ONLY via an
        # internal redirect from a Django view that already checked permission
        # (documents, chat attachments), never directly by a client request.
        location /internal-media/ {
            internal;
            alias /var/www/media/private/;
        }

        # ---- Django Channels (WebSocket) — consumers land in Phase 5 ----
        location /ws/ {
            proxy_pass http://$django;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # ---- Next.js frontend (default) ----
        location / {
            proxy_pass http://$frontend;
            # HMR websocket in dev
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
