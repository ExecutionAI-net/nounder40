# Temporary cutover configuration. Both domains intentionally reach the
# preserved develop stack on 127.0.0.1:8081 until production is restored.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name danzaclassicanounder40.com www.danzaclassicanounder40.com dev.danzaclassicanounder40.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name danzaclassicanounder40.com www.danzaclassicanounder40.com;
    ssl_certificate /etc/letsencrypt/live/danzaclassicanounder40.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danzaclassicanounder40.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    location / { proxy_pass http://127.0.0.1:8081; include /etc/nginx/snippets/nounder40-proxy.conf; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.danzaclassicanounder40.com;
    ssl_certificate /etc/letsencrypt/live/dev.danzaclassicanounder40.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.danzaclassicanounder40.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=63072000" always;
    location / { proxy_pass http://127.0.0.1:8081; include /etc/nginx/snippets/nounder40-proxy.conf; }
}
