name: nounder40

services:
  db:
    image: postgres:16-alpine
    env_file: ./.env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-danza} -d $${POSTGRES_DB:-danza}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  django:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    env_file: ./.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: >
      bash -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput --verbosity 0 &&
      exec daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "
    volumes:
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    command: celery -A config worker -l info
    env_file: ./.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - media_volume:/var/www/media
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  celery_beat:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: ./.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    env_file: ./.env.prod
    environment:
      DJANGO_API_URL: http://django:8000
      API_URL: http://django:8000
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nounder40_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx/nginx-prod.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/letsencrypt
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/www/certbot
        target: /var/www/certbot
        read_only: true
        bind:
          create_host_path: false
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      frontend:
        condition: service_started
      django:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
