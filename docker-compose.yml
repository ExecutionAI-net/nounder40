# No Under 40 — local development stack. `make up` starts everything.
services:
  db:
    image: postgres:16-alpine
    container_name: danza_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-danza}
      POSTGRES_USER: ${POSTGRES_USER:-danza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-danza}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-danza} -d ${POSTGRES_DB:-danza}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: danza_redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build: ./backend
    image: danza_django
    container_name: danza_django
    env_file: ./.env
    working_dir: /code
    restart: unless-stopped
    command: >
      bash -c "
      python manage.py makemigrations --noinput &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput --verbosity 0 &&
      exec python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/code
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    ports:
      - "${DJANGO_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: ./backend
    image: danza_django
    container_name: danza_celery
    command: celery -A config worker -l info
    env_file: ./.env
    working_dir: /code
    restart: unless-stopped
    volumes:
      - ./backend:/code
      - media_volume:/var/www/media
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  celery_beat:
    build: ./backend
    image: danza_django
    container_name: danza_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: ./.env
    working_dir: /code
    restart: unless-stopped
    volumes:
      - ./backend:/code
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      target: base
    image: danza_frontend
    container_name: danza_frontend
    command: npm run dev -- -H 0.0.0.0 -p 3000
    env_file: ./.env
    environment:
      # Browser calls the API same-origin through nginx (relative /api). Server
      # Components (SSR inside this container) reach Django by its compose DNS name.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - API_URL=http://django:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - django

  nginx:
    image: nginx:1.27-alpine
    container_name: danza_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    depends_on:
      - frontend
      - django

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
